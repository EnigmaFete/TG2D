name: Deploy to NindoHost via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to NindoHost public_html
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync files to NindoHost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            ezgif*/**
            *.pdf
            *.zip
            scroll animation/**
